name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Windows, because the tools and testmode target the Windows game install.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Bootstrap pinned tools
        shell: pwsh
        run: ./tools/bootstrap.ps1
      # Game data cannot be published, so tests that need scratch/extracted skip here and run only locally.
      - name: Run tests
        shell: pwsh
        run: ./tools/.venv/Scripts/python.exe -m pytest -q
