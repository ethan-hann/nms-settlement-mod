name: Feature request
description: Suggest a new part, perk, or change
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What problem does it solve for settlement overseers?
  - type: dropdown
    id: module
    attributes:
      label: Which module?
      options:
        - OverseersToolkit (core)
        - Defense
        - SettlementDecor
        - Probes
        - New module
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
