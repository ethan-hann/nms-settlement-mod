name: Feature request
description: Suggest a new part, perk, settlement decision or story, or a change
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: e.g. a fence part for settlement borders, or a story about a Sentinel crash site
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What problem does it solve for settlement overseers?
  - type: dropdown
    id: module
    attributes:
      label: Which module?
      options:
        - OverseersToolkit (core)
        - Defense
        - SettlementDecor
        - SettlerStories
        - New module
        - Not sure
  - type: textarea
    id: vanilla
    attributes:
      label: Anything similar in the game?
      description: New parts reuse the game's own models, and new stories should feel like the game's own. Name a part, decision or place in the game that comes close, or attach a screenshot.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other mods or workarounds you've tried.
